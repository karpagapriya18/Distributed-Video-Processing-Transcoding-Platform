server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 501m;
    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location / { try_files $uri /index.html; }
}
